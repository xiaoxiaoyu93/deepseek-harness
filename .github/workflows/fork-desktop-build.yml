# Build the Desktop application for this fork without release credentials.
#
# Upstream publishes signed and notarized installers from self-hosted runners
# that carry Apple certificates and the release credentials. A personal fork has
# neither, so this workflow builds on GitHub-hosted macOS runners and keeps the
# resulting ad-hoc signed DMG as a workflow artifact. The DMG installs after the
# quarantine attribute is removed:
#
#   xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"
#
# Every push builds both architectures. A dsh-v* tag that names the repository
# version additionally publishes the DMGs as a GitHub release; the tag name
# follows the upstream release convention.

name: Build Desktop · Fork · unsigned macOS

on:
  push:
    branches: ['**']
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Target architecture to build'
        type: choice
        options: [both, mac-x64, mac-arm64]
        default: both
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true

      - id: plan
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/* ]]; then
            version="$(node -p "require('./package.json').version")"
            if [ "$TAG" != "dsh-v$version" ]; then
              echo "the tag $TAG does not name the repository version $version; the release tag is dsh-v$version" >&2
              exit 1
            fi
          fi
          x64='{"target":"mac-x64","arch":"x64","runner":"macos-15-intel","package_script":"package:desktop:mac:x64:unsigned"}'
          arm64='{"target":"mac-arm64","arch":"arm64","runner":"macos-15","package_script":"package:desktop:mac:arm64:unsigned"}'
          case "$TARGET" in
            mac-x64) matrix="[$x64]" ;;
            mac-arm64) matrix="[$arm64]" ;;
            *) matrix="[$x64,$arm64]" ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Configure package caches
        run: |
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=${{ runner.tool_cache }}/dsh-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=${{ runner.tool_cache }}/pnpm-store" >> "$GITHUB_ENV"
          df -h . > disk-before.txt

      - name: Restore package caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/dsh-desktop-package-cache
            ${{ runner.tool_cache }}/pnpm-store
          key: fork-desktop-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            fork-desktop-${{ matrix.target }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Desktop package
        run: |
          set -o pipefail
          pnpm run ${{ matrix.package_script }} 2>&1 | tee build.log

      - name: Report build diagnostics
        if: always()
        run: |
          {
            echo "## Build diagnostics · ${{ matrix.target }}"
            echo
            echo '### Disk before the build'
            echo '```'
            cat disk-before.txt 2>/dev/null || echo 'no record'
            echo '```'
            echo
            echo '### Disk after the build'
            echo '```'
            df -h .
            echo '```'
            echo
            echo '### Build log tail'
            echo '```'
            tail -120 build.log 2>/dev/null || echo 'no log'
            echo '```'
            echo
            echo '### Packaging journal'
            echo '```'
            for journal in apps/desktop/.desktop-build/packaging-runs/*/events.jsonl; do
              [ -f "$journal" ] || continue
              echo "#### $journal"
              tail -40 "$journal"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate package
        id: package
        run: |
          set -euo pipefail
          directory="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          dmg=""
          for candidate in "$directory"/*.dmg; do
            dmg="$candidate"
            break
          done
          if [ -z "$dmg" ]; then
            echo "no DMG in $directory" >&2
            exit 1
          fi
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh "$directory"

      - name: Retain DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-${{ matrix.target }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Attach DMGs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -name '*.dmg')
          if [ ${#packages[@]} -eq 0 ]; then
            echo "no DMG artifact was retained" >&2
            exit 1
          fi
          gh release create "$TAG" "${packages[@]}" --title "$TAG" --generate-notes
