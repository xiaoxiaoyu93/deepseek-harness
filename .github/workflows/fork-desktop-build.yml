# Build the Desktop application for this fork without release credentials.
#
# Upstream publishes signed and notarized installers from self-hosted runners
# that carry Apple certificates and the release credentials. A personal fork has
# neither, so this workflow builds on GitHub-hosted macOS runners and keeps the
# resulting ad-hoc signed DMG as a workflow artifact. The DMG installs after the
# quarantine attribute is removed:
#
#   xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"
#
# Every push builds both architectures. A v* tag additionally publishes the
# DMGs as a GitHub release.

name: Build Desktop · Fork · unsigned macOS

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Target architecture to build'
        type: choice
        options: [both, mac-x64, mac-arm64]
        default: both
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.target == 'both'
      || inputs.target == matrix.target
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target builds on a host of the same architecture, because the
          # primary runtime checks execute the packaged interpreters.
          - target: mac-x64
            arch: x64
            runner: macos-15-intel
            package_script: package:desktop:mac:x64:unsigned
          - target: mac-arm64
            arch: arm64
            runner: macos-15
            package_script: package:desktop:mac:arm64:unsigned
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ runner.tool_cache }}/dsh-desktop-package-cache
      PNPM_CONFIG_STORE_DIR: ${{ runner.tool_cache }}/pnpm-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Restore package caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/dsh-desktop-package-cache
            ${{ runner.tool_cache }}/pnpm-store
          key: fork-desktop-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            fork-desktop-${{ matrix.target }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Desktop package
        run: pnpm run ${{ matrix.package_script }}

      - name: Locate package
        id: package
        run: |
          set -euo pipefail
          directory="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          dmg="$(ls -1 "$directory"/*.dmg | head -1)"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh "$directory"

      - name: Retain DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-${{ matrix.target }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Attach DMGs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" artifacts/*/*.dmg --title "$TAG" --generate-notes
